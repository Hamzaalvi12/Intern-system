<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 75" width="360" height="75" preserveAspectRatio="none">
  <defs>
    <linearGradient id="thNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#142645"/>
    </linearGradient>
    <linearGradient id="thCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="thCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
