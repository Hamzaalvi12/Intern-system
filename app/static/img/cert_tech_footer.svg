    <circle cx="25" cy="45" r="1.5" fill="#38bdf8"/>
    <circle cx="45" cy="45" r="1.5" fill="#38bdf8"/>
    <circle cx="65" cy="45" r="1.5" fill="#38bdf8"/>
    <circle cx="85" cy="45" r="1.5" fill="#38bdf8"/>
    <circle cx="35" cy="65" r="1.5" fill="#38bdf8"/>
    <circle cx="55" cy="65" r="1.5" fill="#38bdf8"/>
    <circle cx="75" cy="65" r="1.5" fill="#38bdf8"/>
    <circle cx="95" cy="65" r="1.5" fill="#38bdf8"/>
  </g>
