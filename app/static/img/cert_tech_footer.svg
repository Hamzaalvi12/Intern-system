<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 85" width="240" height="85" preserveAspectRatio="none">
  <defs>
    <linearGradient id="tfNavy3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#142645"/>
    </linearGradient>
    <linearGradient id="tfCobalt3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tfCyan3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tfGold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>
  </defs>

  <!-- Deep Midnight Navy Corporate Core -->
  <polygon points="0,22 105,22 155,85 0,85" fill="url(#tfNavy3)" />

  <!-- Cobalt Tech Transition Facet -->
